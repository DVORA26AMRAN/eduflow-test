# MPEX B2 — Supabase Storage → Cloudflare R2 backup (copy-based, non-destructive)
#
# Secrets (repository): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID
#
# Does not upload source objects as artifacts. Minimal permissions.

name: storage-backup

on:
  schedule:
    # Daily (UTC)
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: storage-backup-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup protected Storage buckets to R2
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run storage backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/storage-backup/backup.mjs
